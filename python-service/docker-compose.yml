services:
  python-service:
    image: mgrafr/python-service:v3
#   image: ghcr.io/mgrafr/python-service:1.0.3
    container_name: python_service
    ports:
      - "5004:5004"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - /opt/server-api/scripts:/opt/server-api/scripts
      - /opt/server-api/data:/opt/server-api/data
      - .:/app # Monte votre code et votre requirements.txt
      - python_packages:/usr/local/lib/python3.13/dist-packages # Garde les paquets en cache
    working_dir: /app
    command: >
      sh -c "/opt/venv/bin/pip install --no-cache-dir --break-system-packages  -r requirements.txt" & python ./app.py
    restart: unless-stopped

volumes:
  python_packages:
