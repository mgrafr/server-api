services:
  api:
    image: mgrafr/server-api:v7
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - USER=root
    volumes:
      - ./scripts:/scripts
      -  /opt/server-api/backups:/opt/server-api/backups
      -  /opt/server-api:/opt/server-api
      -  /var/lib/gladysassistant:/var/lib/gladysassistant
    restart: unless-stopped
#    depends_on:
#      - db
  python-service:
    image: mgrafr/python-service:v1
    container_name: python_service
    volumes:
      - /opt/server-api/scripts:/opt/server-api/scripts
      - /opt/server-api/data:/opt/server-api/data
    working_dir: /opt/server-api/scripts
    command: tail -f /dev/null  # Reste actif pour recevoir commandes
    restart: unless-stopped

