
services:
  lua:
    image: mgrafr/docker-lua:latest  # Image avec Lua + Luarocks
    container_name: lua
    #working_dir: /app                # Répertoire de travail dans le conteneur
    volumes:
      - /opt/server-api/scripts:/app/modules     # Monte le dossier local ./app dans /app
    command: lua main.lua            # Commande par défaut (peut être changée)
    tty: true                        # Permet d'avoir un terminal interactif
    stdin_open: true
