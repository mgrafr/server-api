services:
  api:
    image: ghcr.io/mgrafr/server-api:1.0.2
#   image: mgrafr/server-api:v8
    extra_hosts:
      - "python_service:127.0.0.1"
    ports:
      - "${PORT_WEB_SERVER-API}:3004"
    environment:
      - NODE_ENV=production
      - USER=root
    volumes:
      - ./scripts:/scripts
      -  /opt/server-api/backups:/opt/server-api/backups
      -  /opt/server-api:/opt/server-api
      -  /var/lib/gladysassistant:/var/lib/gladysassistant
    restart: unless-stopped

  python-service:
    image: mgrafr/python-service:v4
#   image: ghcr.io/mgrafr/python-service:1.0.4
    container_name: python_service
    ports:
      - "${PORT_WEB_PY_SERVICE}:5004"
    environment:
      - NODE_ENV=production
      - PYTHONUNBUFFERED=1
    volumes:
      - /opt/server-api/scripts:/opt/server-api/scripts
      - /opt/server-api/data:/opt/server-api/data
      - python_packages:/usr/local/lib/python3.12/site-packages # Garde les paquets en cache
    command: >
      sh -c "pip install --no-cache-dir --break-system-packages -r requirements.txt & \
      gunicorn app:app --bind 0.0.0.0:5004"
    restart: unless-stopped
  lua:
    image: mgrafr/docker-lua:v1  # Image avec Lua + Luarocks
    # image: ghcr.io/mgrafr/docker-lua:1.0.1
    container_name: docker-lua
    volumes:
      - /opt/server-api/scripts:/app/modules  # Monte le dossier local dans /app/modules
    ports:
      - "${PORT_WEB_LUA}:5104"   # Expose le port 5104 du conteneur sur le port 5104 de l'hôte
    
volumes:
  python_packages:
