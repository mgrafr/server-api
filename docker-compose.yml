services:
  api:
    image: server-api:v7
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - USER=root
    volumes:
      -  /opt/server-api/backups:/opt/server-api/backups
      -  /opt/server-api:/opt/server-api
      -  /var/lib/gladysassistant:/var/lib/gladysassistant
    restart: unless-stopped
#    depends_on:
#      - db
