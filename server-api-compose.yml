services:
  api:
    image: ghcr.io/mgrafr/server-api:1.0.2
#   image: mgrafr/server-api:v8
    extra_hosts:
      - "python_service:127.0.0.1"
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - USER=root
    volumes:
      - ./scripts:/scripts
      -  /opt/server-api/backups:/opt/server-api/backups
      -  /opt/server-api:/opt/server-api
      -  /var/lib/gladysassistant:/var/lib/gladysassistant
    restart: unless-stopped

  python-service:
    image: mgrafr/python-service:v3
#   image: ghcr.io/mgrafr/python-service:1.0.3
    container_name: python_service
    ports:
      - "5004:5004"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - /opt/server-api/scripts:/opt/server-api/scripts
      - /opt/server-api/data:/opt/server-api/data
      - .:/app # Monte le code et requirements.txt
      - python_packages:/usr/local/lib/python3.12/site-packages # Garde les paquets en cache
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir --break-system-packages -r requirements.txt & python app.py"
    restart: unless-stopped

volumes:
  python_packages:
